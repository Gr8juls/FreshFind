services:
  - type: web
    name: freshfind-app
    runtime: node
    plan: free
    region: frankfurt # or oregon, ohio, singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"
      - key: MONGODB_URI
        sync: false # Set in Render dashboard (e.g., from MongoDB Atlas)
      - key: JWT_SECRET
        generateValue: true
